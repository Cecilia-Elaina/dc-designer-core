name: dc-designer-core CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install visual QA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils fonts-noto-cjk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q mcp-server scripts
      - run: node --check site/site.js
      - run: python scripts/release_check.py
      - run: python scripts/site_smoke.py
      - run: python -m pytest -q
      - run: python scripts/package_release.py --output-dir artifacts/dist
      - run: python scripts/clean_install_smoke.py --archive artifacts/dist/dc-designer-core-v1.1.5.zip --timeout 360

  windows-visual:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install visual QA tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install libreoffice -y --no-progress
          $sofficeCommand = Get-Command soffice -ErrorAction SilentlyContinue
          $soffice = if ($sofficeCommand) { Get-Item -LiteralPath $sofficeCommand.Source -ErrorAction SilentlyContinue } else { $null }
          if (-not $soffice) {
            $soffice = Get-ChildItem -Path "C:\Program Files", "C:\Program Files (x86)" -Filter "soffice.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          $popplerVersion = "26.02.0-0"
          $popplerArchive = Join-Path $env:RUNNER_TEMP "Release-$popplerVersion.zip"
          $popplerRoot = Join-Path $env:RUNNER_TEMP "poppler"
          Invoke-WebRequest -Uri "https://github.com/oschwartz10612/poppler-windows/releases/download/v$popplerVersion/Release-$popplerVersion.zip" -OutFile $popplerArchive
          Expand-Archive -Path $popplerArchive -DestinationPath $popplerRoot -Force
          $pdftoppm = Get-ChildItem -Path $popplerRoot -Filter "pdftoppm.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $soffice) { throw "LibreOffice executable was not found after installation." }
          if (-not $pdftoppm) { throw "Poppler pdftoppm executable was not found after installation." }
          $toolDirs = @($soffice.DirectoryName, $pdftoppm.DirectoryName, "C:\ProgramData\chocolatey\bin") | Where-Object { $_ }
          "Path=$($toolDirs -join ';');$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SOFFICE_PATH=$($soffice.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PDFTOPPM_PATH=$($pdftoppm.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $soffice.FullName --version
          & $pdftoppm.FullName -h 2>&1 | Select-Object -First 3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-core.txt
      - run: python -m compileall -q mcp-server scripts
      - run: python scripts/doctor.py --json-output artifacts/doctor.json
      - run: python scripts/acceptance_cases.py
