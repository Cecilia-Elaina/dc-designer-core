name: dc-designer-core CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  changes:
    name: Detect change scope
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.scope.outputs.core }}
      public: ${{ steps.scope.outputs.public }}
      site: ${{ steps.scope.outputs.site }}
      compatibility: ${{ steps.scope.outputs.compatibility }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Classify changed paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$BASE_SHA"
            head="$HEAD_SHA"
          else
            base="$BEFORE_SHA"
            head="$HEAD_SHA"
          fi

          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$base" "$head")"
          else
            files="$(git ls-tree -r --name-only "$head")"
          fi

          core=false
          public=false
          site=false
          compatibility=false
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              site/*)
                site=true
                ;;
              .github/workflows/pages.yml)
                site=true
                ;;
              .codex-plugin/*|.claude-plugin/*|gemini-extension.json|GEMINI.md|.mcp.json|commands/*|prompts/*|docs/agent-compatibility.md|manifest.json|scripts/package_release.py|scripts/release_check.py|scripts/compatibility_check.py)
                compatibility=true
                ;;
              .github/workflows/ci.yml|.agents/plugins/marketplace.json|CITATION.cff|tests/test_public_site.py)
                public=true
                ;;
              docs/*|*.md)
                ;;
              *)
                core=true
                ;;
            esac
          done <<< "$files"

          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "public=$public" >> "$GITHUB_OUTPUT"
          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "compatibility=$compatibility" >> "$GITHUB_OUTPUT"

  site:
    name: Verify product site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check site JavaScript
        run: node --check site/site.js
      - name: Run site smoke test
        run: python scripts/site_smoke.py

  public:
    name: Check public metadata
    needs: changes
    if: needs.changes.outputs.public == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public site JavaScript
        run: node --check site/site.js
      - name: Run public site contract test
        run: python -m unittest discover -s tests -p 'test_public_site.py' -q

  compatibility:
    name: Verify agent adapters
    needs: changes
    if: needs.changes.outputs.compatibility == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check adapter manifests and prompts
        run: python scripts/compatibility_check.py
      - name: Run release metadata audit
        run: python scripts/release_check.py

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install visual QA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils fonts-noto-cjk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q mcp-server scripts
      - run: node --check site/site.js
      - run: python scripts/release_check.py
      - run: python scripts/site_smoke.py
      - run: python -m pytest -q
      - run: python scripts/package_release.py --output-dir artifacts/dist
      - run: python scripts/clean_install_smoke.py --archive artifacts/dist/dc-designer-core-v2.0.0.zip --timeout 360

  windows-visual:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install visual QA tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install libreoffice -y --no-progress
          $sofficeCommand = Get-Command soffice -ErrorAction SilentlyContinue
          $soffice = if ($sofficeCommand) { Get-Item -LiteralPath $sofficeCommand.Source -ErrorAction SilentlyContinue } else { $null }
          if (-not $soffice) {
            $soffice = Get-ChildItem -Path "C:\Program Files", "C:\Program Files (x86)" -Filter "soffice.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          $popplerVersion = "26.02.0-0"
          $popplerArchive = Join-Path $env:RUNNER_TEMP "Release-$popplerVersion.zip"
          $popplerRoot = Join-Path $env:RUNNER_TEMP "poppler"
          Invoke-WebRequest -Uri "https://github.com/oschwartz10612/poppler-windows/releases/download/v$popplerVersion/Release-$popplerVersion.zip" -OutFile $popplerArchive
          Expand-Archive -Path $popplerArchive -DestinationPath $popplerRoot -Force
          $pdftoppm = Get-ChildItem -Path $popplerRoot -Filter "pdftoppm.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $soffice) { throw "LibreOffice executable was not found after installation." }
          if (-not $pdftoppm) { throw "Poppler pdftoppm executable was not found after installation." }
          $toolDirs = @($soffice.DirectoryName, $pdftoppm.DirectoryName, "C:\ProgramData\chocolatey\bin") | Where-Object { $_ }
          "Path=$($toolDirs -join ';');$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SOFFICE_PATH=$($soffice.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PDFTOPPM_PATH=$($pdftoppm.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $soffice.FullName --version
          & $pdftoppm.FullName -h 2>&1 | Select-Object -First 3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-core.txt
      - run: python -m compileall -q mcp-server scripts
      - run: python scripts/doctor.py --json-output artifacts/doctor.json
      - run: python scripts/acceptance_cases.py
